<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--seo: bloco reescrito por página em scripts/prerender-meta.mjs no build-->
<title>Dra. Carolina Mergulhão | Endocrinologista e Metabologista em São Paulo</title>
<meta name="description" content="Endocrinologista e metabologista em São Paulo especializada em emagrecimento, obesidade e saúde hormonal. Tratamento individualizado, muito além da balança. CRM-SP 137.944.">
<!--/seo-->
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#24403A">
<link rel="icon" href="/assets/logos/favicon.png">
</head>
<body>
<script>
  var redirect = sessionStorage.getItem('redirect');
  if (redirect) {
    sessionStorage.removeItem('redirect');
    if (redirect !== window.location.pathname + window.location.search + window.location.hash) {
      history.replaceState(null, '', redirect);
    }
  }
  // Anti-spam SEO: descarta parâmetros usados em ataques de URL (depois de restaurar a rota do 404)
  (function () {
    var blocked = ['r', 'mod', 'uri', 'elementor_library', 'et_core_page_resource'];
    var params = new URLSearchParams(window.location.search);
    var dirty = blocked.some(function (p) { return params.has(p); });
    if (dirty) { window.location.replace(window.location.pathname); }
  })();
</script>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
